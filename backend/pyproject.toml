[project]
name = "hackathon2-phase2-backend"
version = "0.2.0"
description = "FastAPI backend for Hackathon 2 Task Board"
requires-python = ">=3.13"
dependencies = [
  "fastapi[standard]>=0.116.0",
  "sqlmodel>=0.0.24",
  "pydantic>=2.11.7",
  "pyjwt>=2.10.1",
  "psycopg[binary]>=3.3.2",
  "python-dotenv>=1.2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.1",
  "httpx>=0.28.1",
  "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
